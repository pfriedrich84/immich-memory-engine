[tool.poetry]
name = "immich-memory-engine"
version = "0.1.0"
description = "Local-first memory engine for Immich: event detection, album suggestions, and timeline generation."
authors = ["Paul Friedrich"]
readme = "README.md"
packages = [{ include = "memory_engine", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.12.5"
httpx = "^0.27.2"
pydantic = "^2.9.2"
pyyaml = "^6.0.2"
rich = "^13.9.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[tool.poetry.scripts]
memory-engine = "memory_engine.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
