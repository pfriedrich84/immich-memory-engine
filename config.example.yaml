immich:
  # Required. Loaded from .env by Docker Compose and expanded by memory-engine.
  # Target/tested Immich API assumption: 2.7.5 metadata search endpoint.
  url: "${IMMICH_URL}"
  users:
    - name: "paul"
      api_key_env: "IMMICH_API_KEY_PAUL"
    - name: "wife"
      api_key_env: "IMMICH_API_KEY_WIFE"

ollama:
  # Future milestone only; current scan does not call Ollama.
  enabled: "${OLLAMA_ENABLED:-false}"
  url: "${OLLAMA_URL:-http://ollama:11434}"
  model: "${OLLAMA_MODEL:-llama3.1}"

clustering:
  time_gap_hours: 6
  location_radius_meters: 300
  min_assets_per_event: 8
  max_event_duration_days: 3

merge:
  require_time_overlap: true
  max_time_gap_hours: 2
  require_location_match: true
  location_radius_meters: 300

home_location:
  enabled: true
  lat: 48.0
  lon: 16.0
  radius_meters: 500
  outside_home_merge: true
  inside_home_merge: false
  inside_home_event_detection: true
  inside_home_min_assets: 20
  inside_home_max_duration_hours: 8

output:
  # Docker Compose mounts ./output to /app/output. Keep this as output unless the compose volume is changed too.
  dir: "${MEMORY_ENGINE_OUTPUT_DIR:-output}"
  album_prefix: "${MEMORY_ENGINE_ALBUM_PREFIX:-Vorschlag: }"
  dry_run_default: "${MEMORY_ENGINE_DRY_RUN_DEFAULT:-true}"
  debug: "${MEMORY_ENGINE_DEBUG:-false}"
  debug_dir: "${MEMORY_ENGINE_DEBUG_DIR:-output/debug}"
